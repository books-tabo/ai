authors:{ar:{title:"المؤلفين",body:`<h2>تابو نور</h2><p dir="ltr">TABO NOOR</p><p>كاتب ومؤلف يهتم بموضوعات الوعي، وتطوير الذات، والمال، والطموح، وفهم الإنسان لنفسه والعالم من حوله. تتناول كتبه أسئلة السلوك والعلاقات والاختيار والمسؤولية، وتربط التأمل بخطوات عملية تساعد القارئ على بناء حياة أكثر وعيًا.</p><p><a href="/">تصفح كتب تابو نور</a></p>`},en:{title:"Authors",body:`<h2>TABO NOOR</h2><p>تابو نور</p><p>An author focused on awareness, personal growth, money, ambition, and understanding ourselves and the world. His books explore behavior, relationships, choice and responsibility, connecting reflection with practical steps toward a more conscious life.</p><p><a href="/">Browse books by TABO NOOR</a></p>`}},

privacy:{ar:{title:"سياسة الخصوصية",body:`<p>نجمع فقط بيانات التواصل والطلب اللازمة لمعالجة الدفع وتسليم الكتب وتقديم الدعم.</p><h2>الدولة والعملة</h2><p>يستدل الموقع على الدولة من عنوان IP لتطبيق العملة الصحيحة ومنع إساءة استخدام التسعير، ولا يطلب موقع GPS الدقيق. قد يُحفظ اختيار الدولة محليًا في المتصفح، لكن سعر مصر بالجنيه لا يُتاح إلا للاتصالات القادمة من داخل مصر.</p><h2>بيانات الدفع</h2><p>يعالج مزود الدفع بيانات البطاقة ولا يحتفظ تابو بوكس ببيانات البطاقة. لا نبيع البيانات الشخصية لأي طرف.</p><h2>حماية الكتب</h2><p>قد تُضاف بيانات المشتري إلى النسخة الرقمية للحد من إعادة توزيعها بصورة غير مصرح بها.</p>`},en:{title:"Privacy policy",body:`<p>We collect only the contact and order information needed to process payments, deliver purchased books and provide support.</p><h2>Country and currency</h2><p>The site estimates the country from the IP address to apply the correct currency and prevent pricing abuse; it does not request precise GPS location. A country choice may be stored locally, but Egyptian-pound pricing is available only to connections from Egypt.</p><h2>Payment data</h2><p>Card information is handled by the payment provider and is not stored by TABO BOOKS. We do not sell personal data.</p><h2>Book protection</h2><p>Buyer information may be added to a purchased digital copy to discourage unauthorized redistribution.</p>`}},

async function load(country=localStorage.getItem("taboCountry")||"EG"){try{const r=await fetch(`/api/store-config?country=${encodeURIComponent(country)}`,{cache:"no-store"});if(r.ok){config=await r.json();localStorage.setItem("taboCountry",config.country)}}catch(e){}render()}document.getElementById("country").onchange=e=>load(e.target.value);document.getElementById("languageToggle").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("taboLanguage",lang);render()};load();
