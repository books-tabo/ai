<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABO BOOKS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#171717;font-family:Tahoma,Arial,sans-serif}.top{background:#050505;color:#fff;padding:18px}.top div{max-width:920px;margin:auto;display:flex;justify-content:space-between}.top a{color:#d5b85d;text-decoration:none}.brand{color:#fff!important;font-weight:900;letter-spacing:2px}.page{max-width:850px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4dfd2;border-radius:18px;padding:34px;box-shadow:0 12px 35px #0000000b}.card h1{font-size:34px;margin-top:0}.body{line-height:2;color:#444}.body h2{color:#171717;margin-top:28px}.highlight{background:#fbf6e5;border-inline-start:4px solid #c9a227;padding:15px;margin:18px 0}.footer{background:#050505;color:#888;text-align:center;padding:30px 18px;margin-top:50px}.controls,.links{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.controls select,.controls button{background:#111;color:#eee;border:1px solid #58491c;border-radius:8px;padding:9px;font:inherit}.controls button.active{background:#c9a227;color:#111}.links{margin:22px 0}.links a{color:#aaa;text-decoration:none}.note{width:100%;font-size:12px}@media(max-width:600px){.card{padding:23px}.card h1{font-size:29px}}.author-profile{margin-top:32px;padding-top:12px;border-top:1px solid #e4dfd2;scroll-margin-top:24px}</style></head>
<body><header class="top"><div><a class="brand" href="/">TABO BOOKS</a><a href="/" id="back">العودة للمتجر</a></div></header><main class="page"><article class="card"><h1 id="title"></h1><div class="body" id="body"></div></article></main>
<footer class="footer"><div class="controls"><label for="country" id="countryLabel">الدولة</label><select id="country"></select><button id="languageToggle">اللغة</button><span class="note" id="note">يمكنك تغيير الدولة واللغة من هنا.</span></div><nav class="links"><a href="/offers" data-offers-label>عروض الباقات</a><a href="/categories" data-seo-label="categories">أقسام الكتب</a><a href="/authors" id="footerAuthors">المؤلفين</a><a href="/about" id="about">من نحن</a><a href="/contact" id="contact">تواصل معنا</a><a href="/privacy" id="privacy">سياسة الخصوصية</a><a href="/refund" id="refund">الاسترداد والإلغاء</a><a href="/delivery" id="delivery">التوصيل والتسليم</a></nav><div>© 2026 TABO BOOKS</div></footer>
<script>
let lang=localStorage.getItem("taboLanguage")==="en"?"en":"ar",config={country:"EG",countries:[]},renderedBodyLanguage="ar";
const T={ar:{back:"العودة للمتجر",country:"الدولة",language:"اللغة",note:"سعر مصر بالجنيه متاح للزوار داخل مصر فقط.",about:"من نحن",contact:"تواصل معنا",privacy:"سياسة الخصوصية",refund:"الاسترداد والإلغاء",delivery:"التوصيل والتسليم"},en:{back:"Back to store",country:"Country",language:"Language",note:"Egyptian-pound pricing is available only to visitors in Egypt.",about:"About us",contact:"Contact us",privacy:"Privacy policy",refund:"Refunds & cancellation",delivery:"Digital delivery"}};
function render(){const t=T[lang],p=window.TaboSEO.page(lang);document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";if(renderedBodyLanguage!==lang){document.getElementById("title").textContent=p.heading;document.getElementById("body").innerHTML=p.body;renderedBodyLanguage=lang;}for(const [id,v] of [["back",t.back],["countryLabel",t.country],["note",t.note],["about",t.about],["contact",t.contact],["privacy",t.privacy],["refund",t.refund],["delivery",t.delivery]])document.getElementById(id).textContent=v;document.getElementById("footerAuthors").textContent=lang==="ar"?"المؤلفين":"Authors";document.getElementById("languageToggle").textContent=t.language;const select=document.getElementById("country");if(config.countries.length){select.innerHTML=config.countries.map(x=>`<option value="${x.code}">${lang==="ar"?x.nameAr:x.nameEn}</option>`).join("");select.value=config.country}window.TaboSEO.render(lang);if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)requestAnimationFrame(()=>target.scrollIntoView({block:"start"}))}}
async function load(country=localStorage.getItem("taboCountry")||"EG"){try{const r=await fetch(`/api/store-config?country=${encodeURIComponent(country)}`,{cache:"no-store"});if(r.ok){config=await r.json();localStorage.setItem("taboCountry",config.country)}}catch(e){}render()}
document.getElementById("country").onchange=e=>load(e.target.value);document.getElementById("languageToggle").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("taboLanguage",lang);render()};render();load();
</script></body></html>
