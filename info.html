<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABO BOOKS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#171717;font-family:Tahoma,Arial,sans-serif}.top{background:#050505;color:#fff;padding:18px}.top div{max-width:920px;margin:auto;display:flex;justify-content:space-between}.top a{color:#d5b85d;text-decoration:none}.brand{color:#fff!important;font-weight:900;letter-spacing:2px}.page{max-width:850px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4dfd2;border-radius:18px;padding:34px;box-shadow:0 12px 35px #0000000b}.card h1{font-size:34px;margin-top:0}.body{line-height:2;color:#444}.body h2{color:#171717;margin-top:28px}.highlight{background:#fbf6e5;border-inline-start:4px solid #c9a227;padding:15px;margin:18px 0}.footer{background:#050505;color:#888;text-align:center;padding:30px 18px;margin-top:50px}.controls,.links{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.controls select,.controls button{background:#111;color:#eee;border:1px solid #58491c;border-radius:8px;padding:9px;font:inherit}.controls button.active{background:#c9a227;color:#111}.links{margin:22px 0}.links a{color:#aaa;text-decoration:none}.note{width:100%;font-size:12px}@media(max-width:600px){.card{padding:23px}.card h1{font-size:29px}}</style></head>
<body><header class="top"><div><a class="brand" href="/">TABO BOOKS</a><a href="/" id="back">العودة للمتجر</a></div></header><main class="page"><article class="card"><h1 id="title"></h1><div class="body" id="body"></div></article></main>
<footer class="footer"><div class="controls"><label for="country" id="countryLabel">الدولة</label><select id="country"></select><button id="languageToggle">اللغة</button><span class="note" id="note">يمكنك تغيير الدولة واللغة من هنا.</span></div><nav class="links"><a href="/about" id="about">من نحن</a><a href="/contact" id="contact">تواصل معنا</a><a href="/privacy" id="privacy">سياسة الخصوصية</a><a href="/refund" id="refund">الاسترداد والإلغاء</a><a href="/delivery" id="delivery">التوصيل والتسليم</a></nav><div>© 2026 TABO BOOKS</div></footer>
<script>
const CONTENT={
about:{ar:{title:"من نحن",body:`<p>تابو بوكس مكتبة رقمية تهدف إلى تقديم كتب عربية أصلية في الوعي وتطوير الذات والمال والطموح وفهم الإنسان لنفسه والعالم من حوله.</p><p>جميع المنتجات المتاحة في المتجر كتب رقمية بصيغة PDF من تأليف <strong>تابو نور</strong>، وتُسلَّم إلكترونيًا بعد تأكيد الدفع.</p><div class="highlight">هدفنا تقديم محتوى واضح وعميق وقابل للتطبيق، مع تجربة شراء آمنة وبسيطة.</div>`},en:{title:"About us",body:`<p>TABO BOOKS is a digital bookstore publishing original Arabic books about awareness, personal growth, money, ambition and understanding human nature.</p><p>All products are digital PDF editions written by <strong>TABO NOOR</strong> and delivered electronically after confirmed payment.</p><div class="highlight">Our goal is to offer clear, thoughtful and practical content through a safe and simple purchasing experience.</div>`}},
contact:{ar:{title:"تواصل معنا",body:`<p>يمكنك التواصل معنا للاستفسار عن الكتب أو متابعة الطلبات أو حل مشكلات التحميل.</p><h2>واتساب</h2><p dir="ltr">+20 112 296 5693</p><h2>البريد الإلكتروني</h2><p><a href="mailto:taponoor@gmail.com">taponoor@gmail.com</a></p><div class="highlight">يرجى إرفاق رقم الطلب عند التواصل بخصوص عملية شراء.</div>`},en:{title:"Contact us",body:`<p>Contact us with questions about books, orders or download access.</p><h2>WhatsApp</h2><p>+20 112 296 5693</p><h2>Email</h2><p><a href="mailto:taponoor@gmail.com">taponoor@gmail.com</a></p><div class="highlight">Please include your order number when contacting us about a purchase.</div>`}},
privacy:{ar:{title:"سياسة الخصوصية",body:`<p>نجمع فقط بيانات التواصل والطلب اللازمة لمعالجة الدفع وتسليم الكتب وتقديم الدعم.</p><h2>الدولة والعملة</h2><p>قد يحدد الموقع الدولة اعتمادًا على لغة المتصفح أو المنطقة الزمنية، ويحفظ اختيارك محليًا لعرض العملة المناسبة. يمكنك تغيير الدولة في أي وقت من ذيل الموقع.</p><h2>بيانات الدفع</h2><p>يعالج مزود الدفع بيانات البطاقة ولا يحتفظ تابو بوكس ببيانات البطاقة. لا نبيع البيانات الشخصية لأي طرف.</p><h2>حماية الكتب</h2><p>قد تُضاف بيانات المشتري إلى النسخة الرقمية للحد من إعادة توزيعها بصورة غير مصرح بها.</p>`},en:{title:"Privacy policy",body:`<p>We collect only the contact and order information needed to process payments, deliver purchased books and provide support.</p><h2>Country and currency</h2><p>The site may determine a country from browser language or time zone and store the chosen country locally to display the appropriate currency. You can change it from the footer at any time.</p><h2>Payment data</h2><p>Card information is handled by the payment provider and is not stored by TABO BOOKS. We do not sell personal data.</p><h2>Book protection</h2><p>Buyer information may be added to a purchased digital copy to discourage unauthorized redistribution.</p>`}},
refund:{ar:{title:"سياسة الاسترداد والإلغاء",body:`<p>لأن الكتب منتجات رقمية قابلة للتحميل، لا يمكن عادةً استرداد قيمة الطلب بعد تأكيد الدفع وإتاحة الملف.</p><p>يمكن مراجعة الحالات التي حدث فيها خصم مكرر، أو دفع بقيمة غير صحيحة، أو تعذر فيها الوصول إلى الملفات بسبب مشكلة فنية من جانب المتجر.</p><div class="highlight">تواصل معنا مع رقم الطلب وشرح المشكلة، وسنراجع الحالة بصورة عادلة.</div>`},en:{title:"Refunds and cancellation",body:`<p>Because PDF books are downloadable digital products, completed orders are generally non-refundable after payment is confirmed and access is delivered.</p><p>We can review duplicate charges, incorrect payment amounts, or cases where a store-side technical issue prevented access.</p><div class="highlight">Contact us with your order number and a description of the issue for a fair review.</div>`}},
delivery:{ar:{title:"سياسة التوصيل والتسليم",body:`<p>جميع الكتب تُسلَّم رقميًا بعد نجاح الدفع. لا توجد منتجات مادية أو رسوم شحن.</p><p>بعد وصول تأكيد الدفع الموثوق إلى المتجر، تظهر روابط تحميل الكتب التي اشتريتها. قد يستغرق التأكيد لحظات وفقًا لمزود الدفع.</p><div class="highlight">إذا لم تصل الملفات، تواصل معنا مع رقم الطلب ولا ترسل بيانات بطاقتك.</div>`},en:{title:"Digital delivery policy",body:`<p>All books are delivered digitally after successful payment. No physical item is shipped and no shipping fee applies.</p><p>Download links appear after the store receives verified payment confirmation. This may take a few moments depending on the payment provider.</p><div class="highlight">If your files do not appear, contact us with your order number. Never send your card details.</div>`}}
};
const key=location.pathname.split("/").filter(Boolean)[0]||"about",page=CONTENT[key]||CONTENT.about;let lang=localStorage.getItem("taboLanguage")||"ar",config={country:"EG",countries:[]};const T={ar:{back:"العودة للمتجر",country:"الدولة",language:"اللغة",note:"يمكنك تغيير الدولة واللغة من هنا.",about:"من نحن",contact:"تواصل معنا",privacy:"سياسة الخصوصية",refund:"الاسترداد والإلغاء",delivery:"التوصيل والتسليم"},en:{back:"Back to store",country:"Country",language:"Language",note:"You can change the country and language here.",about:"About us",contact:"Contact us",privacy:"Privacy policy",refund:"Refunds & cancellation",delivery:"Digital delivery"}};
function render(){const t=T[lang],p=page[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=`${p.title} | TABO BOOKS`;document.getElementById("title").textContent=p.title;document.getElementById("body").innerHTML=p.body;for(const [id,v] of [["back",t.back],["countryLabel",t.country],["note",t.note],["about",t.about],["contact",t.contact],["privacy",t.privacy],["refund",t.refund],["delivery",t.delivery]])document.getElementById(id).textContent=v;document.getElementById("languageToggle").textContent=t.language;const select=document.getElementById("country");if(config.countries.length){select.innerHTML=config.countries.map(x=>`<option value="${x.code}">${lang==="ar"?x.nameAr:x.nameEn}</option>`).join("");select.value=config.country}}
async function load(country=localStorage.getItem("taboCountry")||"EG"){try{const r=await fetch(`/api/store-config?country=${encodeURIComponent(country)}`,{cache:"no-store"});if(r.ok){config=await r.json();localStorage.setItem("taboCountry",config.country)}}catch(e){}render()}document.getElementById("country").onchange=e=>load(e.target.value);document.getElementById("languageToggle").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("taboLanguage",lang);render()};load();
</script></body></html>
