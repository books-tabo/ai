<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABO BOOKS</title><style>body{font-family:Tahoma,Arial;background:#f6f5f2;color:#171717;margin:0}.box{max-width:640px;margin:7vh auto;background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{font-size:25px}.gold{color:#aa8321}input,button{display:block;width:100%;padding:13px;margin:12px 0;box-sizing:border-box;border-radius:8px;border:1px solid #bbb;font:inherit}button{background:#171717;color:#fff;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}.book{border-top:1px solid #ddd;padding:16px 0}.book b{display:block;margin-bottom:4px}.remaining{color:#725913;font-size:14px}.notice{padding:12px;background:#f8f4e9;border-radius:8px}.error{color:#a11}.success{color:#176b36}</style></head>
<body><main class="box"><strong>TABO <span class="gold">BOOKS</span></strong><h1 id="title"></h1><div id="content"></div></main>
<script>
const en=localStorage.getItem('taboLanguage')==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
const L=en?{title:'Your secured books',checking:'Verifying this device…',invalid:'This page is not authorized on this device.',legacy:'To secure your previous purchase, enter the exact name and phone number used for the order. The old link will then be disabled.',name:'Full name',phone:'Phone number in English digits',activate:'Secure this device',error:'Something went wrong',ready:'This page works only on the device used to activate the purchase. Each book can be downloaded exactly twice.',download:'Download PDF',remaining:n=>`${n} of 2 downloads remaining`,used:'The two downloads have been used.',working:'Preparing your protected copy…'}:{title:'كتبك المؤمّنة',checking:'جارٍ التحقق من هذا الجهاز…',invalid:'هذه الصفحة غير مصرح بها على هذا الجهاز.',legacy:'لتأمين عملية الشراء السابقة، أدخل الاسم ورقم الهاتف المسجلين في الطلب بالضبط. بعدها يُلغى الرابط القديم نهائيًا.',name:'الاسم الكامل',phone:'رقم الهاتف بالأرقام الإنجليزية',activate:'تأمين هذا الجهاز',error:'حدث خطأ',ready:'هذه الصفحة تعمل على جهاز تفعيل الشراء فقط. ويمكن تنزيل كل كتاب مرتين بالضبط.',download:'تحميل PDF',remaining:n=>`متبقي ${n} من محاولتي التحميل`,used:'تم استهلاك محاولتي التحميل.',working:'جارٍ تجهيز نسختك المحمية…'};
document.getElementById('title').textContent=L.title;const content=document.getElementById('content'),params=new URLSearchParams(location.search);let order=params.get('order'),token=params.get('token');const escapeHTML=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function legacyForm(){content.innerHTML=`<p class="notice">${L.legacy}</p><form id="activate"><label>${L.name}<input name="name" maxlength="100" required autocomplete="name"></label><label>${L.phone}<input name="phone" inputmode="tel" pattern="\\+?[0-9]{8,15}" required autocomplete="tel"></label><button>${L.activate}</button></form><p id="error" class="error"></p>`;document.getElementById('activate').onsubmit=async e=>{e.preventDefault();const f=e.target,button=f.querySelector('button');button.disabled=true;try{const r=await fetch('/api/download-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,name:f.elements.namedItem('name').value,phone:f.elements.namedItem('phone').value})}),d=await r.json();if(!r.ok)throw Error(d.error||L.error);order=d.order_id;token=null;location.replace(d.success_url)}catch(error){document.getElementById('error').textContent=error.message||L.error;button.disabled=false}}}
async function downloadBook(id,button){button.disabled=true;const old=button.textContent;button.textContent=L.working;try{const r=await fetch('/api/download/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:order})});if(!r.ok){const d=await r.json();throw Error(d.error||L.error)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`TABO-${id}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);await refresh()}catch(error){alert(error.message||L.error);button.disabled=false;button.textContent=old}}
async function refresh(){if(!order){if(token)return legacyForm();content.textContent=L.invalid;return}content.textContent=L.checking;try{const r=await fetch('/api/downloads?order='+encodeURIComponent(order),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||L.invalid);content.innerHTML=`<p class="notice">${L.ready}</p>`+d.books.map(b=>`<div class="book"><b>${escapeHTML(b.name)}</b><span class="remaining">${b.remaining?L.remaining(b.remaining):L.used}</span><button data-book="${escapeHTML(b.id)}" ${b.remaining?'':'disabled'}>${b.remaining?L.download:L.used}</button></div>`).join('');document.querySelectorAll('button[data-book]').forEach(button=>button.onclick=()=>downloadBook(button.dataset.book,button))}catch(error){content.innerHTML=`<p class="error">${escapeHTML(error.message||L.invalid)}</p>`}}refresh();
</script></body></html>
