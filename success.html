<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABO BOOKS | تحميل الكتب</title><style>body{font-family:Tahoma,Arial;background:#f6f5f2;color:#171717;margin:0}.box{max-width:640px;margin:7vh auto;background:white;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{font-size:25px}.gold{color:#aa8321}input,button{display:block;width:100%;padding:13px;margin:12px 0;box-sizing:border-box;border-radius:8px;border:1px solid #bbb;font:inherit}button,a.download{background:#171717;color:white;cursor:pointer;text-align:center}a.download{display:inline-block;padding:10px 17px;border-radius:8px;text-decoration:none;margin:8px}.book{border-top:1px solid #ddd;padding:12px 0}small{color:#777}.error{color:#a11}</style></head><body><main class="box"><strong>TABO <span class="gold">BOOKS</span></strong><h1>كتبك بعد تأكيد الدفع</h1><div id="content">جاري التحقق من الطلب...</div></main><script>
const token=new URLSearchParams(location.search).get('token');const content=document.getElementById('content');
const escapeHTML=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){if(!token){content.textContent='رابط غير صالح.';return}try{const r=await fetch('/api/downloads?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error);if(d.needsBuyer){content.innerHTML='<p>أدخل اسمك ورقم هاتفك ليُكتبا على كل صفحة من الكتب التي اشتريتها. راجع البيانات قبل التأكيد، فلا يمكن تعديلها من هذه الصفحة.</p><form id="buyer"><label>الاسم الكامل<input name="name" maxlength="100" required autocomplete="name"></label><label>رقم الهاتف بالأرقام الإنجليزية<input name="phone" inputmode="tel" pattern="\\+?[0-9]{8,15}" required autocomplete="tel"></label><button>تجهيز الكتب</button></form><p id="error" class="error"></p>';document.getElementById('buyer').onsubmit=async e=>{e.preventDefault();const f=e.target;const r=await fetch('/api/buyer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,name:f.elements.namedItem('name').value,phone:f.elements.namedItem('phone').value})});const j=await r.json();if(!r.ok){document.getElementById('error').textContent=j.error||'حدث خطأ';return}refresh()};return}content.innerHTML='<p>النسخ مخصصة باسمك ورقمك. احتفظ برابط هذه الصفحة في مكان آمن.</p>'+d.books.map(b=>'<div class="book"><b>'+escapeHTML(b.name)+'</b><a class="download" href="'+escapeHTML(b.url)+'">تحميل PDF</a></div>').join('')}catch(e){content.textContent=e.message}}</script><script>refresh()</script></body></html>
