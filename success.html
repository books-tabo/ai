<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABO BOOKS</title><style>body{font-family:Tahoma,Arial;background:#f6f5f2;color:#171717;margin:0}.box{max-width:640px;margin:7vh auto;background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{font-size:25px}.gold{color:#aa8321}input,button{display:block;width:100%;padding:13px;margin:12px 0;box-sizing:border-box;border-radius:8px;border:1px solid #bbb;font:inherit}button,a.download{background:#171717;color:#fff;cursor:pointer;text-align:center}a.download{display:inline-block;padding:10px 17px;border-radius:8px;text-decoration:none;margin:8px}.book{border-top:1px solid #ddd;padding:12px 0}.error{color:#a11}</style></head>
<body><main class="box"><strong>TABO <span class="gold">BOOKS</span></strong><h1 id="title"></h1><div id="content"></div></main>
<script>
const en=localStorage.getItem('taboLanguage')==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
const L=en?{title:'Your books after payment',checking:'Verifying your order…',invalid:'Invalid link.',intro:'Enter your name and phone number. They will be added to every page of your purchased books. Check them carefully before confirming.',name:'Full name',phone:'Phone number in English digits',prepare:'Prepare books',error:'Something went wrong',ready:'Your copies are personalized. Keep this page link safe.',download:'Download PDF'}:{title:'كتبك بعد تأكيد الدفع',checking:'جاري التحقق من الطلب...',invalid:'رابط غير صالح.',intro:'أدخل اسمك ورقم هاتفك ليُكتبا على كل صفحة من الكتب التي اشتريتها. راجع البيانات قبل التأكيد، فلا يمكن تعديلها من هذه الصفحة.',name:'الاسم الكامل',phone:'رقم الهاتف بالأرقام الإنجليزية',prepare:'تجهيز الكتب',error:'حدث خطأ',ready:'النسخ مخصصة باسمك ورقمك. احتفظ برابط هذه الصفحة في مكان آمن.',download:'تحميل PDF'};
document.getElementById('title').textContent=L.title;const content=document.getElementById('content');content.textContent=L.checking;const token=new URLSearchParams(location.search).get('token');const escapeHTML=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){if(!token){content.textContent=L.invalid;return}try{const r=await fetch('/api/downloads?token='+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw Error(d.error);if(d.needsBuyer){content.innerHTML=`<p>${L.intro}</p><form id="buyer"><label>${L.name}<input name="name" maxlength="100" required autocomplete="name"></label><label>${L.phone}<input name="phone" inputmode="tel" pattern="\\+?[0-9]{8,15}" required autocomplete="tel"></label><button>${L.prepare}</button></form><p id="error" class="error"></p>`;document.getElementById('buyer').onsubmit=async e=>{e.preventDefault();const f=e.target,r=await fetch('/api/buyer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,name:f.elements.namedItem('name').value,phone:f.elements.namedItem('phone').value})}),j=await r.json();if(!r.ok){document.getElementById('error').textContent=j.error||L.error;return}refresh()};return}content.innerHTML=`<p>${L.ready}</p>`+d.books.map(b=>`<div class="book"><b>${escapeHTML(b.name)}</b><a class="download" href="${escapeHTML(b.url)}">${L.download}</a></div>`).join('')}catch(e){content.textContent=e.message}}refresh();
</script></body></html>
