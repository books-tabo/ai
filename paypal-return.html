<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>تأكيد الدفع عبر PayPal | TABO BOOKS</title><style>body{font:16px/1.9 Tahoma,Arial,sans-serif;background:#f7f6f2;color:#161616;margin:0}.box{max-width:600px;margin:10vh auto;padding:28px;background:#fff;border:1px solid #e6e1d3;border-radius:18px}a,button{display:inline-block;padding:12px 20px;background:#111;color:#fff;border:0;border-radius:8px;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.6}.gold{color:#9b761b}</style></head><body><main class="box"><strong>TABO <span class="gold">BOOKS</span></strong><h1 id="title">تأكيد الدفع عبر PayPal</h1><p id="state" role="status">جارٍ التحقق من حالة الدفع…</p><button id="retry" hidden>إعادة المحاولة</button> <a id="track" href="/" hidden>متابعة الطلب</a></main><script>
const english=localStorage.getItem('taboLanguage')==='en';document.documentElement.lang=english?'en':'ar';document.documentElement.dir=english?'ltr':'rtl';
const c=english?{title:'Confirm PayPal payment',checking:'Checking payment status…',pending:'PayPal has not confirmed a completed payment yet. No download has been activated.',failed:'Could not confirm the payment. Retry or return to order tracking.',invalid:'Return to the original purchasing browser to confirm this order.',retry:'Retry confirmation',track:'Track order'}:{title:'تأكيد الدفع عبر PayPal',checking:'جارٍ التحقق من حالة الدفع…',pending:'لم يؤكد PayPal اكتمال التحصيل بعد. لم يتم تفعيل تحميل الكتب.',failed:'تعذر تأكيد الدفع الآن. أعد المحاولة أو ارجع إلى متابعة الطلب.',invalid:'ارجع إلى متصفح الشراء الأصلي لتأكيد هذا الطلب.',retry:'إعادة المحاولة',track:'متابعة الطلب'};
const params=new URLSearchParams(location.search),key=params.get('key'),token=params.get('token');
// Remove payment identifiers before any further navigation. This page has no ad tags.
history.replaceState({},'',location.pathname);
const state=document.getElementById('state'),retry=document.getElementById('retry'),track=document.getElementById('track');
document.getElementById('title').textContent=c.title;retry.textContent=c.retry;track.textContent=c.track;
let busy=false;
async function confirmPayment(){if(busy)return;if(!/^[0-9a-f]{64}$/.test(key||'')||!/^[A-Z0-9]{10,32}$/.test(token||'')){state.textContent=c.invalid;return}busy=true;retry.hidden=true;state.textContent=c.checking;track.href='/pending.html?key='+encodeURIComponent(key);track.hidden=false;try{const response=await fetch('/api/paypal/capture',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,token})});const data=await response.json();if(!response.ok||data.ok!==true)throw Error();if(data.paid===true){
    try{
        const activation=await fetch('/api/download-session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
        const download=await activation.json();
        if(!activation.ok||download.ok!==true||!download.success_url)throw Error();
        sessionStorage.removeItem('taboPayment:'+key);
        location.replace(download.success_url);
    }catch(_){location.replace(track.href);}
    return;
}state.textContent=c.pending;retry.hidden=false}catch(_){state.textContent=c.failed;retry.hidden=false}finally{busy=false}}
retry.addEventListener('click',confirmPayment);confirmPayment();
</script></body></html>
