<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABO BOOKS | متابعة الدفع</title><style>body{font-family:Tahoma,Arial;background:#f6f5f2;color:#161616;margin:0}.box{max-width:620px;margin:7vh auto;background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{font-size:25px}.gold{color:#aa8321}.button{display:inline-block;background:#111;color:white;padding:13px 20px;border-radius:9px;text-decoration:none;margin:15px 0}li{margin:7px 0}small{color:#666}#state{padding:12px;background:#f8f4e9;border-radius:8px}</style></head><body><main class="box"><strong>TABO <span class="gold">BOOKS</span></strong><h1>متابعة طلبك</h1><p id="order"></p><ul id="books"></ul><a id="payment" class="button" target="_blank" rel="noopener noreferrer" hidden>فتح صفحة الدفع</a><p id="state">جارٍ فحص حالة الطلب...</p><small>أكمل الدفع في صفحة Paymob ثم عد إلى هذه النافذة. تظهر كتبك هنا بعد وصول تأكيد الدفع الموثوق إلى المتجر؛ قد يستغرق ذلك لحظات. احتفظ برقم الطلب عند التواصل مع الدعم.</small></main><script>
const key=new URLSearchParams(location.search).get('key');const state=document.getElementById('state');const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const payment=key&&sessionStorage.getItem('taboPayment:'+key);if(payment){const a=document.getElementById('payment');a.href=payment;a.hidden=false}
let stopped=false;async function check(){if(!key){state.textContent='رابط المتابعة غير صالح.';return}try{const r=await fetch('/api/order-status?key='+encodeURIComponent(key),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر فحص الطلب');document.getElementById('order').textContent='رقم الطلب: '+d.order_id;document.getElementById('books').innerHTML=d.books.map(b=>'<li>'+escapeHTML(b)+'</li>').join('');if(d.status==='PAID'&&d.success_url){stopped=true;state.textContent='تم تأكيد الدفع! نجهز صفحة تحميل كتبك...';sessionStorage.removeItem('taboPayment:'+key);location.replace(d.success_url);return}state.textContent='بانتظار تأكيد الدفع من Paymob...'}catch(e){state.textContent=e.message}if(!stopped)setTimeout(check,5000)}check();
</script></body></html>
