<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TABO BOOKS</title><style>body{font-family:Tahoma,Arial;background:#f6f5f2;color:#161616;margin:0}.box{max-width:620px;margin:7vh auto;background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{font-size:25px}.gold{color:#aa8321}.button{display:inline-block;background:#111;color:#fff;padding:13px 20px;border-radius:9px;text-decoration:none;margin:15px 0}li{margin:7px 0}small{color:#666}#state{padding:12px;background:#f8f4e9;border-radius:8px}.error{color:#a11}#paymentSummary{margin:22px 0;padding:18px;border:1px solid #e4dfd2;border-radius:12px}#displayTotal{display:block;font-size:34px;font-weight:800;margin:8px 0;direction:ltr;unicode-bidi:isolate}#chargeTotal{font-size:13px;line-height:1.8;color:#555;margin:8px 0}#bankNote{display:block;font-size:12px;line-height:1.8}#payment[hidden],#paymentSummary[hidden],#chargeTotal[hidden],#bankNote[hidden]{display:none}</style></head>
<body><main class="box"><strong>TABO <span class="gold">BOOKS</span></strong><h1 id="title"></h1><p id="order"></p><ul id="books"></ul><section id="paymentSummary" aria-live="polite" hidden><span id="priceLabel"></span><strong id="displayTotal"></strong><p id="chargeTotal"></p><small id="bankNote"></small></section><a id="payment" class="button" target="_blank" rel="noopener noreferrer" hidden></a><p id="state"></p><small id="note"></small></main>
<script>
const en=localStorage.getItem('taboLanguage')==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
const L=en?{title:'Track your order',open:'Open payment page',checking:'Checking order status…',invalid:'Invalid tracking link.',failed:'Could not check the order.',number:'Order number: ',paid:'Payment confirmed. Securing this device…',waiting:'Waiting for secure payment confirmation…',note:'Keep this original tracking page open while you pay. Downloads are activated only on the purchasing device and each book can be downloaded twice.',device:'This order can only be activated from the original purchasing device. Return to the tracking page you opened before payment.'}:{title:'متابعة طلبك',open:'فتح صفحة الدفع',checking:'جارٍ فحص حالة الطلب...',invalid:'رابط المتابعة غير صالح.',failed:'تعذر فحص الطلب',number:'رقم الطلب: ',paid:'تم تأكيد الدفع. جارٍ تأمين التحميل لهذا الجهاز…',waiting:'بانتظار تأكيد الدفع الآمن...',note:'اترك صفحة المتابعة الأصلية مفتوحة أثناء الدفع. يُفعّل التحميل على جهاز الشراء فقط، ولكل كتاب محاولتا تحميل.',device:'لا يمكن تفعيل الطلب إلا من جهاز الشراء الأصلي. ارجع إلى صفحة المتابعة التي فتحتها قبل الدفع.'};
document.getElementById('title').textContent=L.title;document.getElementById('payment').textContent=L.open;document.getElementById('state').textContent=L.checking;document.getElementById('note').textContent=L.note;
const key=new URLSearchParams(location.search).get('key'),state=document.getElementById('state'),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const payment=key&&sessionStorage.getItem('taboPayment:'+key);if(payment){const a=document.getElementById('payment');a.href=payment;a.hidden=false}
/* Payment price display start */
function renderPricing(price){
    const box=document.getElementById('paymentSummary');box.hidden=true;
    if(!price || !['USD','EGP'].includes(price.displayCurrency) || !['USD','EGP'].includes(price.chargeCurrency))return;
    const display=Number(price.displayTotal),charge=Number(price.chargeTotal);
    if(!Number.isFinite(display)||display<=0||!Number.isFinite(charge)||charge<=0)return;
    const converted=price.displayCurrency==='USD'&&price.chargeCurrency==='EGP';
    if(price.displayCurrency!==price.chargeCurrency&&!converted)return;
    if(!converted&&display!==charge)return;
    const amount=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    document.getElementById('priceLabel').textContent=price.displayCurrency==='USD'?(en?'Order total in USD':'إجمالي الطلب بالدولار'):(en?'Order total':'إجمالي الطلب');
    document.getElementById('displayTotal').textContent=price.displayCurrency==='USD'?amount.format(display)+' USD':(en?'EGP '+amount.format(display):amount.format(display)+' جنيه');
    const chargeNote=document.getElementById('chargeTotal');chargeNote.hidden=!converted;
    chargeNote.textContent=en?'Kashier will charge EGP '+amount.format(charge)+'.':'سيتم تحصيل '+amount.format(charge)+' جنيه مصري عبر كاشير.';
    const bankNote=document.getElementById('bankNote');bankNote.hidden=!converted;
    bankNote.textContent=en?'If your card uses another currency, your bank determines its conversion rate and any fees.':'عند اختلاف عملة بطاقتك، يحدد بنكك سعر التحويل وأي رسوم.';
    box.hidden=false;
}
/* Payment price display end */
let stopped=false,activating=false;
async function activate(){if(activating)return;activating=true;const r=await fetch('/api/download-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})}),d=await r.json();if(!r.ok)throw Error(d.error||L.device);sessionStorage.removeItem('taboPayment:'+key);location.replace(d.success_url)}
async function check(){if(!key){state.textContent=L.invalid;return}try{const r=await fetch('/api/order-status?key='+encodeURIComponent(key),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||L.failed);document.getElementById('order').textContent=L.number+d.order_id;document.getElementById('books').innerHTML=d.books.map(b=>'<li>'+escapeHTML(b)+'</li>').join('');renderPricing(d.pricing);if(d.status==='PAID'&&d.ready){stopped=true;state.textContent=L.paid;await activate();return}state.textContent=L.waiting}catch(e){state.textContent=e.message||L.failed;state.classList.add('error')}if(!stopped)setTimeout(check,5000)}check();
</script></body></html>
