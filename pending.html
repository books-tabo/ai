<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TABO BOOKS</title><style>body{font-family:Tahoma,Arial;background:#f6f5f2;color:#161616;margin:0}.box{max-width:620px;margin:7vh auto;background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{font-size:25px}.gold{color:#aa8321}.button{display:inline-block;background:#111;color:#fff;padding:13px 20px;border-radius:9px;text-decoration:none;margin:15px 0}li{margin:7px 0}small{color:#666}#state{padding:12px;background:#f8f4e9;border-radius:8px}</style></head>
<body><main class="box"><strong>TABO <span class="gold">BOOKS</span></strong><h1 id="title"></h1><p id="order"></p><ul id="books"></ul><a id="payment" class="button" target="_blank" rel="noopener noreferrer" hidden></a><p id="state"></p><small id="note"></small></main>
<script>
const en=localStorage.getItem('taboLanguage')==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
const L=en?{title:'Track your order',open:'Open payment page',checking:'Checking order status…',invalid:'Invalid tracking link.',failed:'Could not check the order.',number:'Order number: ',paid:'Payment confirmed. Preparing your downloads…',waiting:'Waiting for Paymob payment confirmation…',note:'Complete payment on Paymob, then return here. Your books will appear after the store receives verified confirmation. Keep your order number for support.'}:{title:'متابعة طلبك',open:'فتح صفحة الدفع',checking:'جارٍ فحص حالة الطلب...',invalid:'رابط المتابعة غير صالح.',failed:'تعذر فحص الطلب',number:'رقم الطلب: ',paid:'تم تأكيد الدفع! نجهز صفحة تحميل كتبك...',waiting:'بانتظار تأكيد الدفع من Paymob...',note:'أكمل الدفع في صفحة Paymob ثم عد إلى هذه النافذة. تظهر كتبك هنا بعد وصول تأكيد الدفع الموثوق إلى المتجر؛ قد يستغرق ذلك لحظات. احتفظ برقم الطلب عند التواصل مع الدعم.'};
document.getElementById('title').textContent=L.title;document.getElementById('payment').textContent=L.open;document.getElementById('state').textContent=L.checking;document.getElementById('note').textContent=L.note;
const key=new URLSearchParams(location.search).get('key'),state=document.getElementById('state'),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const payment=key&&sessionStorage.getItem('taboPayment:'+key);if(payment){const a=document.getElementById('payment');a.href=payment;a.hidden=false}
let stopped=false;async function check(){if(!key){state.textContent=L.invalid;return}try{const r=await fetch('/api/order-status?key='+encodeURIComponent(key),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||L.failed);document.getElementById('order').textContent=L.number+d.order_id;document.getElementById('books').innerHTML=d.books.map(b=>'<li>'+escapeHTML(b)+'</li>').join('');if(d.status==='PAID'&&d.success_url){stopped=true;state.textContent=L.paid;sessionStorage.removeItem('taboPayment:'+key);location.replace(d.success_url);return}state.textContent=L.waiting}catch(e){state.textContent=e.message}if(!stopped)setTimeout(check,5000)}check();
</script></body></html>
