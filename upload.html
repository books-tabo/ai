<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رفع كتاب أصنام</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#111;color:#eee;max-width:650px;margin:50px auto;padding:20px}main{background:#1d1d1d;padding:24px;border-radius:16px}input,button{display:block;width:100%;margin:18px 0;padding:14px;box-sizing:border-box}button{background:#c9a227;border:0;border-radius:8px;font-weight:800}#status{white-space:pre-wrap}</style></head>
<body><main><h1>رفع النسخة الأصلية: أصنام</h1><input id="file" type="file" accept="application/pdf"><button id="upload">رفع الكتاب</button><p id="status">اختر ملف PDF.</p></main>
<script>
const status=document.getElementById('status');
document.getElementById('upload').onclick=async()=>{
  const file=document.getElementById('file').files[0];
  const token=location.hash.slice(1);
  if(!file||!token){status.textContent='الملف أو رمز الرفع غير موجود.';return}
  status.textContent='جارٍ الرفع...';
  try{
    const response=await fetch('/api/admin/upload-original',{method:'POST',headers:{'Content-Type':'application/pdf','X-Upload-Token':token},body:file});
    const result=await response.json();
    status.textContent=response.ok?`تم رفع ${result.name} (${result.bytes} بايت).`:`فشل الرفع: ${result.error}`;
  }catch(error){status.textContent='تعذر الاتصال بالخادم.'}
};
</script></body></html>
