<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رفع كتاب TABO</title><style>body{font-family:system-ui;background:#111;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0}.box{width:min(88vw,520px);padding:28px;border:1px solid #665528;border-radius:16px;background:#181818}h1{margin-top:0}input,button{display:block;width:100%;box-sizing:border-box;margin:18px 0;padding:14px;border-radius:9px;font:inherit}button{background:#c9a227;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.45}#status{min-height:24px}</style></head><body><main class="box"><h1>رفع الكتاب السابع</h1><input id="file" type="file" accept="application/pdf"><button id="upload" type="button">رفع book7.pdf</button><p id="status"></p></main><script>const file=document.getElementById('file'),button=document.getElementById('upload'),status=document.getElementById('status');button.onclick=async()=>{const selected=file.files[0],token=location.hash.slice(1);if(!selected||!token){status.textContent='اختر ملف PDF صالحًا.';return}button.disabled=true;status.textContent='جارٍ الرفع...';try{const response=await fetch('/api/admin/upload-original',{method:'POST',headers:{'Content-Type':'application/pdf','X-Upload-Token':token},body:selected});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Upload failed');status.textContent='تم رفع book7.pdf بنجاح.'}catch(error){status.textContent='فشل الرفع: '+error.message;button.disabled=false}};</script></body></html>
