book5:{name:"شهوات",enName:"Desires",image:"https://i.ibb.co/6cLgHxqY/image.png",size:10032567,short:"رحلة لفهم الرغبات الخفية وراء المال والحب والنجاح والاهتمام والمكانة.",enShort:"Understand the hidden desires behind money, love, success, attention and status.",about:"«شهوات» لا يتعامل مع الشهوة باعتبارها رغبة جسدية فقط، بل ينظر إليها جزءًا أساسيًا من التجربة الإنسانية. يناقش رغبات المال والحب والنجاح والشهرة والمكانة والقوة، ويسأل: لماذا نريد ما نريده؟",enAbout:"Desires looks beyond physical desire to the motives behind money, love, success, fame, status and power. It asks not only what we want, but why we want it.",adds:"يساعدك على فهم الدوافع الخفية وراء اختياراتك والتمييز بين الحاجة والرغبة والشهوة.",enAdds:"It helps you distinguish needs, wants and impulses, pause before reacting, and understand what your desires are really asking for.",idea:"السؤال ليس فقط: ماذا تشتهي؟ بل: لماذا تشتهي ما تشتهيه؟",enIdea:"The question is not only what you desire, but why you desire it."},

function render(){const c=C[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=`${lang==="ar"?book.name:book.enName} | TABO BOOKS`;document.getElementById("cover").src=book.image;document.getElementById("cover").alt=lang==="ar"?book.name:book.enName;document.getElementById("title").textContent=lang==="ar"?book.name:book.enName;document.getElementById("short").textContent=lang==="ar"?book.short:book.enShort;document.getElementById("about").textContent=lang==="ar"?book.about:book.enAbout;document.getElementById("adds").textContent=lang==="ar"?book.adds:book.enAdds;document.getElementById("idea").textContent=lang==="ar"?book.idea:book.enIdea;document.getElementById("author").textContent=c.author;document.getElementById("price").textContent=money(config.prices["1"]||150);document.getElementById("pages").textContent=stats.pageCount||c.unknown;document.getElementById("size").textContent=fileSize(book.size);document.getElementById("reviews").textContent=stats.reviews||0;document.getElementById("downloads").textContent=stats.downloads||0;const value=Number(stats.rating)||0,filled=myRating||Math.round(value);document.querySelectorAll("#stars button").forEach(button=>{const star=Number(button.dataset.rating);button.classList.toggle("active",star<=filled);button.disabled=ratingBusy;button.setAttribute("aria-label",`${star} / 5`)});document.getElementById("stars").setAttribute("aria-label",c.rate);document.getElementById("ratingText").textContent=stats.reviews?`${value.toFixed(1)} (${stats.reviews})`:c.new;const help=document.getElementById("ratingHelp");help.textContent=ratingState==="success"?`${c.rated} — ${c.yourRating}: ${myRating}/5`:ratingState==="error"?c.ratingError:myRating?`${c.yourRating}: ${myRating}/5 — ${c.rate}`:c.rate;help.className=`rating-help ${ratingState}`;for(const [key,text] of [["backLink",c.back],["aboutTitle",c.about],["addsTitle",c.adds],["authorTitle",c.authorTitle],["pagesLabel",c.pages],["sizeLabel",c.size],["reviewsLabel",c.reviews],["downloadsLabel",c.downloads],["cartLink",c.cart],["countryLabel",c.country],["locationNote",c.note],["aboutLink",c.aboutLink],["contactLink",c.contact],["privacyLink",c.privacy],["refundLink",c.refund],["deliveryLink",c.delivery]])document.getElementById(key).textContent=text;document.getElementById("addBtn").textContent=isAdded()?c.added:c.add;document.getElementById("languageToggle").textContent=c.language;const select=document.getElementById("country");if(config.countries.length){select.innerHTML=config.countries.map(x=>`<option value="${x.code}">${lang==="ar"?x.nameAr:x.nameEn}</option>`).join("");select.value=config.country}}
async function submitRating(rating){if(ratingBusy)return;ratingBusy=true;ratingState="";render();try{const response=await fetch("/api/ratings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({book_id:id,rating})});const result=await response.json();if(!response.ok||!result.ok)throw new Error("rating failed");myRating=rating;localStorage.setItem(`taboRating_${id}`,String(rating));stats={...stats,...result.stats};ratingState="success"}catch(error){ratingState="error"}finally{ratingBusy=false;render()}}
async function load(country=browserCountry()){try{const r=await fetch(`/api/store-config?country=${encodeURIComponent(country)}`,{cache:"no-store"});if(r.ok){config=await r.json();localStorage.setItem("taboCountry",config.country)}}catch(e){}try{const r=await fetch("/api/book-stats",{cache:"no-store"});if(r.ok){const all=await r.json();stats=all[id]||stats}}catch(e){}render()}
document.getElementById("stars").onclick=e=>{const button=e.target.closest("button[data-rating]");if(button)submitRating(Number(button.dataset.rating))};document.getElementById("addBtn").onclick=()=>{const items=cart();if(!items.some(x=>x.id===id)){items.push({type:"book",id});localStorage.setItem("taboBooksCart",JSON.stringify(items))}render()};document.getElementById("country").onchange=e=>load(e.target.value);document.getElementById("languageToggle").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("taboLanguage",lang);render()};load();
</script>
