<title>إتمام الطلب | TABO BOOKS</title><link rel="canonical" href="https://tabobooks.com/checkout">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#171717;font:16px/1.65 Tahoma,Arial,sans-serif}
.brand{text-align:center;letter-spacing:5px;font-weight:800;padding:14px 12px 10px}.brand span{color:#aa8321}
main{max-width:640px;margin:0 auto 20px;padding:20px 24px;background:white;border:1px solid #e6e0d2;border-radius:14px}
h1{font-size:23px;margin:0 0 10px}.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
select,.language{border:1px solid #d4cfbf;border-radius:7px;background:white;padding:6px;font:inherit;color:#333}
.cart-item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.cart-item-name{font-weight:700}.cart-item-price{font-size:14px;color:#666}.fixed-price-note{font-size:12px;color:#80621d;margin-top:5px}
.delete-item{border:0;background:#f1f1ef;border-radius:7px;min-width:36px;min-height:36px;cursor:pointer;color:#333}
.offer-applied{padding:8px 10px;background:#fbf7e8;border:1px solid #dfd1a1;border-radius:8px;margin-top:8px;font-size:13px}
#cartNextMessage{font-size:12px;color:#665b41;margin:8px 0}.cart-summary{border-top:2px solid #161616;padding-top:10px;margin:12px 0}
.summary-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0}.summary-final{font-size:22px;font-weight:800}.summary-final strong{font-size:30px;direction:ltr;unicode-bidi:isolate}
#checkoutFields{display:grid;gap:8px;margin-bottom:14px}label{display:block;font-size:13px}input{display:block;width:100%;border:1px solid #aaa;border-radius:7px;background:#fff;color:#111;padding:9px 11px;margin-top:3px;font:16px/1.4 Tahoma,Arial,sans-serif;min-height:44px}
input[type=email],input[type=tel]{direction:ltr;text-align:start}.payment-methods{display:flex;flex-direction:column;gap:8px}
.payment-button{width:100%;border:0;border-radius:8px;padding:12px 14px;min-height:48px;font:700 16px/1.5 Tahoma,Arial,sans-serif;cursor:pointer;color:white}
.card-payment{background:#15803d}.card-payment:hover{background:#166534}.paypal-payment{background:#111}.paypal-payment:hover{background:#333}
button:disabled{opacity:.55;cursor:wait}.payment-details{display:grid;gap:6px;margin-top:10px}.payment-note{font-size:13px;line-height:1.65;color:#555;margin:0}.notice{background:#faf6e9;padding:10px;border-radius:8px}.delivery-note{color:#666;font-size:12px;text-align:center;margin:10px 0 0}
.field-help,.field-error{display:block;font-size:12px;line-height:1.6;margin-top:4px}.field-help{color:#626262}.field-error{color:#a51d24}input[aria-invalid="true"]{border-color:#a51d24;outline-color:#a51d24}.checkout-status{margin:0;color:#97301c;font-size:13px;line-height:1.7}
.payment-brands{display:flex;direction:ltr;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;border-top:1px solid #eee;margin-top:12px;padding-top:12px}.payment-brands img{display:block;object-fit:contain}.payment-brands .paypal-logo{width:76px;height:24px}.payment-brands .visa-logo{width:68px;height:32px;padding:6px;background:#1434cb;border-radius:4px}.payment-brands .mastercard-logo{width:48px;height:34px}.payment-brands .applepay-logo{width:auto;height:34px}.applepay-note{text-align:center;font-size:12px;color:#666;margin:8px 0 0}
#emptyCart{text-align:center;padding:25px 0}#emptyCart a{color:#775c17}#retryConfig{border:1px solid #b69a46;background:white;border-radius:6px;padding:10px 18px;cursor:pointer}
[hidden]{display:none!important}@media(max-width:600px){.brand{padding:12px 10px 8px;font-size:14px}main{margin:0 8px 16px;padding:16px 14px;border-radius:12px}h1{font-size:21px}.summary-final{font-size:20px}.summary-final strong{font-size:29px}}

<label for="checkoutPhone"><span id="phoneLabel">رقم الهاتف</span><input id="checkoutPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="80" required aria-describedby="checkoutPhoneHelp checkoutPhoneError"><span class="field-help" id="checkoutPhoneHelp">لتحديد صاحب الطلب ومساعدتك عند الحاجة. نقبل الأرقام العربية والإنجليزية.</span><span class="field-error" id="checkoutPhoneError" hidden></span></label>
</div>
<label id="recoveryConsentWrap" class="recovery-consent" hidden><input type="checkbox" id="recoveryConsent"><span id="recoveryConsentLabel">ذكّرني برسالة بريد واحدة إذا لم أكمل الدفع خلال ساعة. يمكنني إيقاف التذكير من الرسالة.</span></label>
<div class="payment-methods">
<button type="button" class="payment-button card-payment" id="checkoutBtn" aria-describedby="chargeCurrencyNote checkoutNotice" disabled>الدفع بالبطاقات والمحافظ و&#x2066;Apple Pay&#x2069;</button>
<button type="button" class="payment-button paypal-payment" id="paypalCheckoutBtn" aria-describedby="paypalCheckoutNote" hidden>الدفع عبر PayPal بالدولار</button>
</div>
<div class="payment-details">

<p id="chargeCurrencyNote" class="payment-note" role="status" style="display:none;font-size:13px"></p><p id="checkoutNotice" class="payment-note" role="status" hidden></p>
<p id="paypalCheckoutNote" class="payment-note" hidden>PayPal: سيتم تحصيل الإجمالي المعروض بالدولار الأمريكي.</p>
