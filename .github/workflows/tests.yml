name: Backend safety tests
on:
  push:
    branches: [feature/tobo-books-render-preview]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      TABO_CHECKOUT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py supabase_store.py localization.py proxy_identity.py pdf_limits.py book_previews.py checkout_pricing.py
      - run: python -m ruff check --select E9,F63,F7,F82 .
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_meta_tracking.cjs
      - run: node tests/test_checkout_quote.cjs
      - run: node tests/test_seo_rendering.cjs
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tabo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TABO_CHECKOUT_ENABLED: '0'
      TABO_TEST_DATABASE_URL: postgresql://postgres:synthetic_test_only@127.0.0.1:5432/tabo_test
      TABO_ALLOW_TEST_DATABASE_RESET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/integration -v
